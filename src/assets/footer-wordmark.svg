    <!--
      Handwriting reveal. The mask is a set of pen strokes tracing the tag in
      the order it is written — the T's bar then its stem, r, i, b, e, the two
      dots — each an open path drawn on with stroke-dashoffset. `wm-settle` is
      the whole mark; it fades in over the last beat so the finished state is
      the clean artwork, not just what the strokes happened to cover.
      Animation lives in founderQuote.ts. Pre-animation state in Footer.astro.
    -->
